name: Deploy Financial System to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --force

      - name: 🏗️ Build production files (Static Export)
        run: npx next build && node scripts/prepare-export.cjs
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: '/financial-system'
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.top1.ly' }}
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: 🚀 Sync files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: ./financial-system/
          dangerous-clean-slate: false
